name: release
# Tag vX.Y.Z to build the .deb, the Arch package, the AppImage, the Windows zip and the Android APK and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One toolchain for every job. Without this each container's rustup default
# decides the compiler, so the same commit can build in one job and fail in
# another. Keep in step with the version used locally.
env:
  RUST_TOOLCHAIN: '1.98.1'
  # Pinned BtbN FFmpeg build (GPL, shared DLLs) for the Windows host. BtbN prunes old
  # autobuild tags after a while; when this 404s, pick a current tag whose asset is
  # ffmpeg-n8.1*-win64-gpl-shared-8.1.zip and update both lines.
  FFMPEG_WIN_TAG: 'autobuild-2026-10-27-18-38'
  FFMPEG_WIN_ASSET: 'ffmpeg-n8.1.3-24-g92611900bb-win64-gpl-shared-8.1'

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:trixie   # ffmpeg 7.x; ffmpeg's soname is baked into the package
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          apt-get install -y build-essential curl pkg-config clang libclang-dev dpkg-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libx264-dev \
            libpipewire-0.3-dev libopus-dev libxcb1-dev libx11-dev libfontconfig-dev \
            libgbm-dev libxkbcommon-dev libwayland-dev libudev-dev libssl-dev \
            libegl-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain $RUST_TOOLCHAIN
      - run: . "$HOME/.cargo/env" && cd host && cargo build --release --locked
      - run: packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: '*.deb' }

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git ffmpeg x264 pipewire opus libxcb libx11 fontconfig mesa libxkbcommon wayland cargo clang
      # khronos-egl (pulled in by xcap) needs egl.pc at build time. It ships in
      # libglvnd, which mesa happens to depend on today, so name it explicitly
      # rather than relying on that transitive edge.
      - run: pacman -S --noconfirm --needed libglvnd
      - uses: actions/checkout@v4
      - run: |
          # rustup and its toolchain land in root's home, and /root is not
          # readable by the builder, so the builder needs its own rustup.
          useradd -m builder && chown -R builder .
          # `su - builder` (with the dash) gives a login shell, so HOME and
          # PATH come from the builder's own profile and find cargo. It also starts in
          # the builder's home, so cd to the checkout by absolute path ($PWD expands here).
          su - builder -c "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain $RUST_TOOLCHAIN && cd $PWD/packaging/arch && makepkg -f --nodeps"
      - uses: actions/upload-artifact@v4
        with: { name: arch, path: 'packaging/arch/*.pkg.tar.zst' }

  appimage:
    runs-on: ubuntu-24.04   # 22.04's pipewire (0.3.48) is too old for libspa-sys
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev libfuse2t64 \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libx264-dev \
            libpipewire-0.3-dev libopus-dev libxcb1-dev libx11-dev libfontconfig-dev \
            libgbm-dev libxkbcommon-dev libwayland-dev libudev-dev libssl-dev \
            libegl-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain $RUST_TOOLCHAIN
      - run: . "$HOME/.cargo/env" && cd host && cargo build --release --locked
      - run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: '*.AppImage' }

  windows:
    runs-on: windows-latest   # MSVC is preinstalled
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: windows-cargo-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: windows-cargo-
      # bindgen (ffmpeg-sys-next) needs libclang. The runner image ships LLVM at
      # C:\Program Files\LLVM; the check fails early if an image update moves it.
      - name: Point the build at LLVM and FFmpeg
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVMin\libclang.dll')) { throw 'LLVM is not at C:\Program Files\LLVM on this runner image' }
          "LIBCLANG_PATH=C:\Program Files\LLVMin" >> $env:GITHUB_ENV
          "C:\Program Files\LLVMin" >> $env:GITHUB_PATH
          $dir = "$env:RUNNER_TEMPfmpeg"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_WIN_TAG/$env:FFMPEG_WIN_ASSET.zip" -OutFile "$env:RUNNER_TEMPfmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMPfmpeg.zip" -DestinationPath $dir
          "FFMPEG_DIR=$dir\$env:FFMPEG_WIN_ASSET" >> $env:GITHUB_ENV
          # The test binaries load the FFmpeg DLLs at start-up.
          "$dir\$env:FFMPEG_WIN_ASSETin" >> $env:GITHUB_PATH
      - run: cargo check --locked --no-default-features
        working-directory: host
      # The encoder tests skip a backend that fails to open, so they pass on a runner
      # without a GPU (the libx264 fallback still runs).
      - run: cargo test --locked --features encoders
        working-directory: host
      - run: packaging/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'DisplaySwarm-*-windows-x64.zip' }

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # An optimised release build signed with the one project key. The debug
      # build used before ran debuggable and unoptimised, and CI's throwaway debug
      # key changed every run, so no update could install over the last one.
      - name: Build signed release APK
        env:
          DS_KEYSTORE_BASE64: ${{ secrets.DS_KEYSTORE_BASE64 }}
          DS_STORE_PASSWORD: ${{ secrets.DS_STORE_PASSWORD }}
          DS_KEY_ALIAS: ${{ secrets.DS_KEY_ALIAS }}
          DS_KEY_PASSWORD: ${{ secrets.DS_KEY_PASSWORD }}
        run: |
          test -n "$DS_KEYSTORE_BASE64" || { echo "::error::DS_KEYSTORE_BASE64 secret is not set"; exit 1; }
          export DS_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$DS_KEYSTORE_BASE64" | base64 -d > "$DS_KEYSTORE"
          cd client-android && ./gradlew assembleRelease
      - run: cp client-android/app/build/outputs/apk/release/app-release.apk DisplaySwarm-${GITHUB_REF_NAME#v}.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: '*.apk' }

  release:
    needs: [deb, arch, appimage, windows, apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
