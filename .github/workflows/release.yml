name: release
# Tag vX.Y.Z to build the .deb, the Arch package, the AppImage and the Android APK and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One toolchain for every job. Without this each container's rustup default
# decides the compiler, so the same commit can build in one job and fail in
# another. Keep in step with the version used locally.
env:
  RUST_TOOLCHAIN: '1.98.1'

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:trixie   # ffmpeg 7.x; ffmpeg's soname is baked into the package
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: |
          apt-get update
          apt-get install -y build-essential curl pkg-config clang libclang-dev dpkg-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libx264-dev \
            libpipewire-0.3-dev libopus-dev libxcb1-dev libx11-dev libfontconfig-dev \
            libgbm-dev libxkbcommon-dev libwayland-dev libudev-dev libssl-dev \
            libegl-dev
      - run: cd host && cargo build --release --locked
      - run: packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: '*.deb' }

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git ffmpeg x264 pipewire opus libxcb libx11 fontconfig mesa libxkbcommon wayland cargo clang
      # khronos-egl (pulled in by xcap) needs egl.pc at build time. It ships in
      # libglvnd, which mesa happens to depend on today, so name it explicitly
      # rather than relying on that transitive edge.
      - run: pacman -S --noconfirm --needed libglvnd
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain $RUST_TOOLCHAIN
      - uses: actions/checkout@v4
      - run: |
          . "$HOME/.cargo/env"
          useradd -m builder && chown -R builder .
          su builder -c ". \"\$HOME/.cargo/env\" && cd packaging/arch && makepkg -f --nodeps"
      - uses: actions/upload-artifact@v4
        with: { name: arch, path: 'packaging/arch/*.pkg.tar.zst' }

  appimage:
    runs-on: ubuntu-22.04   # oldest glibc we can build on, so the AppImage runs widely
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev libfuse2 \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libx264-dev \
            libpipewire-0.3-dev libopus-dev libxcb1-dev libx11-dev libfontconfig-dev \
            libgbm-dev libxkbcommon-dev libwayland-dev libudev-dev libssl-dev \
            libegl-dev
      - run: cd host && cargo build --release --locked
      - run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: '*.AppImage' }

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: cd client-android && ./gradlew assembleDebug
      - run: cp client-android/app/build/outputs/apk/debug/app-debug.apk DisplaySwarm-${GITHUB_REF_NAME#v}.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: '*.apk' }

  release:
    needs: [deb, arch, appimage, apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
